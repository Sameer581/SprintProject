<div class="container mt-4">
  <h4 class="mb-4">Friends</h4>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-4" id="friendsTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="friends-tab" data-bs-toggle="tab" data-bs-target="#friends" type="button" role="tab" aria-controls="friends" aria-selected="true">
        My Friends <span class="badge bg-secondary ms-1">{{ friends.length }}</span>
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="requests-tab" data-bs-toggle="tab" data-bs-target="#requests" type="button" role="tab" aria-controls="requests" aria-selected="false">
        Friend Requests 
        <span class="badge bg-danger ms-1" *ngIf="pendingRequests.length > 0">{{ pendingRequests.length }}</span>
      </button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content" id="friendsTabContent">
    
    <!-- My Friends Tab -->
    <div class="tab-pane fade show active" id="friends" role="tabpanel" aria-labelledby="friends-tab">
      <div *ngIf="loadingFriends" class="text-center my-4">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
      
      <div *ngIf="!loadingFriends && friends.length === 0" class="alert alert-light text-center">
        You don't have any friends yet.
      </div>

      <div class="row row-cols-1 row-cols-md-2 g-4" *ngIf="!loadingFriends && friends.length > 0">
        <div class="col" *ngFor="let friend of friends">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body d-flex align-items-center">
              <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center text-white me-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                <i class="bi bi-person-fill"></i>
              </div>
              <div>
                <h6 class="mb-1 fw-bold">
                  <a [routerLink]="['/profile', friend.userId1 === currentUserId ? friend.userId2 : friend.userId1]" class="text-decoration-none text-dark">
                    {{ friend.userId1 === currentUserId ? (friend.username2 || 'User ' + friend.userId2) : (friend.username1 || 'User ' + friend.userId1) }}
                  </a>
                </h6>
                <small class="text-muted">Friend</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Requests Tab -->
    <div class="tab-pane fade" id="requests" role="tabpanel" aria-labelledby="requests-tab">
      <div *ngIf="loadingRequests" class="text-center my-4">
        <div class="spinner-border text-primary" role="status"></div>
      </div>

      <div *ngIf="!loadingRequests && pendingRequests.length === 0" class="alert alert-light text-center">
        No pending friend requests.
      </div>

      <div class="row row-cols-1 row-cols-md-2 g-4" *ngIf="!loadingRequests && pendingRequests.length > 0">
        <div class="col" *ngFor="let request of pendingRequests">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center">
                <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center text-white me-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                  <i class="bi bi-person-fill"></i>
                </div>
                <div>
                  <h6 class="mb-1 fw-bold">
                    <a [routerLink]="['/profile', request.userId1]" class="text-decoration-none text-dark">
                      {{ request.username1 || 'User ' + request.userId1 }}
                    </a>
                  </h6>
                  <small class="text-muted">Sent you a request</small>
                </div>
              </div>
              <div class="d-flex flex-column gap-2">
                <button class="btn btn-sm btn-primary" (click)="acceptRequest(request.friendshipId)">Accept</button>
                <button class="btn btn-sm btn-outline-danger" (click)="rejectRequest(request.friendshipId)">Reject</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
