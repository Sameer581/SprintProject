<button 
  class="btn btn-sm border-0 d-flex align-items-center" 
  [ngClass]="isLiked ? 'text-danger' : 'text-muted'"
  (click)="toggleLike()"
  [disabled]="!userId"
  style="background: transparent; box-shadow: none; padding: 0;">
  <i class="bi fs-5" [ngClass]="isLiked ? 'bi-heart-fill' : 'bi-heart'"></i>
  <span class="ms-1 fw-bold" style="font-size: 1rem;">{{ likeCount }}</span>
</button>
