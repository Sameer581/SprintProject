<div *ngIf="loading" class="d-flex justify-content-center my-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div *ngIf="!loading && user" class="container mt-4">
  <!-- Profile Header Card -->
  <div class="card shadow-sm mb-4 border-0">
    <!-- Cover Photo Area -->
    <div class="bg-primary rounded-top" style="height: 150px;"></div>
    
    <div class="card-body position-relative pb-4 px-4">
      <!-- Avatar -->
      <div class="position-absolute" style="top: -50px;">
        <div class="rounded-circle bg-white p-1 shadow-sm d-inline-block">
          <ng-container *ngIf="user.profilePicture; else noProfilePic">
            <img [src]="'assets/images/' + user.profilePicture" alt="Profile Picture" class="rounded-circle object-fit-cover" style="width: 100px; height: 100px;">
          </ng-container>
          <ng-template #noProfilePic>
            <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center text-white" style="width: 100px; height: 100px; font-size: 3rem;">
              <i class="bi bi-person-fill"></i>
            </div>
          </ng-template>
        </div>
      </div>

      <!-- User Info & Actions -->
      <div class="d-flex justify-content-between align-items-end" style="margin-top: 50px;">
        <div>
          <h3 class="mb-0 fw-bold">{{ user.username }}</h3>
          <p class="text-muted mb-0"><i class="bi bi-envelope me-2"></i>{{ user.email }}</p>
        </div>

        <div>
          <ng-container *ngIf="isOwnProfile">
            <button class="btn btn-outline-primary" routerLink="/settings">
              <i class="bi bi-pencil-square me-2"></i>Edit Profile
            </button>
          </ng-container>

          <ng-container *ngIf="!isOwnProfile">
            <button *ngIf="friendshipStatus === 'none'" class="btn btn-primary" (click)="sendFriendRequest()">
              <i class="bi bi-person-plus-fill me-2"></i>Add Friend
            </button>
            <button *ngIf="friendshipStatus === 'pending'" class="btn btn-secondary" disabled>
              <i class="bi bi-clock-history me-2"></i>Request Sent
            </button>
            <button *ngIf="friendshipStatus === 'accepted'" class="btn btn-success" disabled>
              <i class="bi bi-person-check-fill me-2"></i>Friends
            </button>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

  <!-- User Posts -->
  <h5 class="mb-3">Posts by {{ user.username }}</h5>
  <div *ngIf="posts.length === 0" class="alert alert-light text-center">
    No posts yet.
  </div>
  
  <div *ngFor="let post of posts">
    <app-post-card [post]="post"></app-post-card>
  </div>
</div>
