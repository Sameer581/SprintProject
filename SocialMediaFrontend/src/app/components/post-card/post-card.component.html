<div class="card shadow-sm mb-4 border-0">
  <div class="card-body">
    <!-- Post Header -->
    <div class="d-flex align-items-center mb-3">
      <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center text-white me-3" style="width: 45px; height: 45px; font-size: 1.2rem;">
        <i class="bi bi-person-fill"></i>
      </div>
      <div>
        <h6 class="mb-0 fw-bold">
          <a [routerLink]="['/profile', post.userId]" class="text-decoration-none text-dark">{{ post.username }}</a>
        </h6>
        <small class="text-muted">{{ post.timestamp | date:'medium' }}</small>
      </div>
    </div>

    <!-- Post Content -->
    <p class="card-text">{{ post.content }}</p>

    <!-- Actions (Like & Comment Toggle) -->
    <div class="d-flex border-top pt-3 mt-3 gap-2">
      <app-like-button [postId]="post.postId"></app-like-button>
      
      <button class="btn btn-sm btn-outline-secondary d-flex align-items-center" (click)="toggleComments()">
        <i class="bi bi-chat-text me-1"></i> Comments
      </button>
    </div>

    <!-- Comments Section (Inline) -->
    <div *ngIf="showComments" class="mt-4 pt-3 border-top">
      <h6 class="mb-3">Comments</h6>

      <!-- Loading State -->
      <div *ngIf="loadingComments" class="text-center my-3">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
      </div>

      <!-- Comment List -->
      <div class="d-flex flex-column gap-3 mb-3" *ngIf="!loadingComments">
        <div *ngIf="comments.length === 0" class="text-muted small">No comments yet. Be the first!</div>
        
        <div class="d-flex align-items-start" *ngFor="let comment of comments">
          <div class="rounded-circle bg-light d-flex justify-content-center align-items-center text-secondary me-2" style="width: 35px; height: 35px; min-width: 35px;">
            <i class="bi bi-person"></i>
          </div>
          <div class="bg-light rounded p-2 flex-grow-1">
            <div class="fw-bold" style="font-size: 0.85rem;">
              <a [routerLink]="['/profile', comment.userId]" class="text-decoration-none text-dark">{{ comment.username || 'User ' + comment.userId }}</a>
            </div>
            <div style="font-size: 0.9rem;">{{ comment.commentText }}</div>
            <div class="text-muted" style="font-size: 0.75rem;">{{ comment.timestamp | date:'short' }}</div>
          </div>
        </div>
      </div>

      <!-- Add Comment Form -->
      <form (ngSubmit)="submitComment()" class="d-flex mt-3">
        <input 
          type="text" 
          class="form-control rounded-pill me-2" 
          placeholder="Write a comment..." 
          name="newCommentText"
          [(ngModel)]="newCommentText"
          required>
        <button 
          type="submit" 
          class="btn btn-primary rounded-pill px-3"
          [disabled]="!newCommentText.trim() || isSubmittingComment">
          <i class="bi bi-send" *ngIf="!isSubmittingComment"></i>
          <span class="spinner-border spinner-border-sm" *ngIf="isSubmittingComment"></span>
        </button>
      </form>
    </div>
  </div>
</div>
