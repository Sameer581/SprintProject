<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
  <div class="container-fluid px-4">
    <!-- Brand -->
    <a class="navbar-brand fw-bold" routerLink="/feed">
      <i class="bi bi-globe-americas me-2"></i>SocialConnect
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarMain">
      <!-- Search Form -->
      <form class="d-flex mx-auto my-2 my-lg-0 position-relative" style="max-width: 400px; width: 100%;" (ngSubmit)="onSubmit()">
        <div class="input-group">
          <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
          <input class="form-control border-0 shadow-none" type="search" placeholder="Search users, groups..." 
                 name="searchQuery" [(ngModel)]="searchQuery" (input)="onSearchChange()" (blur)="hideDropdown()" autocomplete="off">
        </div>
        
        <!-- Live Search Dropdown -->
        <div class="position-absolute w-100 bg-white rounded shadow-sm overflow-hidden" 
             style="top: 110%; z-index: 1050; border: 1px solid #eee;" 
             *ngIf="showDropdown && (userResults.length > 0 || groupResults.length > 0 || isSearching)">
          
          <div class="p-2 text-center text-muted small" *ngIf="isSearching">
            <span class="spinner-border spinner-border-sm me-1"></span> Searching...
          </div>
          
          <div class="list-group list-group-flush" *ngIf="!isSearching">
            <h6 class="dropdown-header text-primary fw-bold bg-light" *ngIf="userResults.length > 0">Users</h6>
            <a href="javascript:void(0)" class="list-group-item list-group-item-action d-flex align-items-center border-0" 
               *ngFor="let u of userResults" (mousedown)="goToProfile(u.userId)">
               <div class="rounded-circle bg-secondary text-white d-flex justify-content-center align-items-center me-2" style="width: 30px; height: 30px; font-size: 0.9rem;">
                 <i class="bi bi-person-fill"></i>
               </div>
               <span>{{ u.username }}</span>
            </a>
            
            <h6 class="dropdown-header text-primary fw-bold bg-light" *ngIf="groupResults.length > 0">Groups</h6>
            <a href="javascript:void(0)" class="list-group-item list-group-item-action d-flex align-items-center border-0" 
               *ngFor="let g of groupResults" (mousedown)="goToGroup(g.groupId)">
               <div class="rounded bg-secondary text-white d-flex justify-content-center align-items-center me-2" style="width: 30px; height: 30px; font-size: 0.9rem;">
                 <i class="bi bi-diagram-3-fill"></i>
               </div>
               <span>{{ g.groupName }}</span>
            </a>
          </div>
        </div>
      </form>

      <!-- Right align items -->
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link text-white position-relative" routerLink="/notifications">
            <i class="bi bi-bell-fill fs-5"></i>
            <!-- <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">3</span> -->
          </a>
        </li>
        <li class="nav-item me-3">
          <a class="nav-link text-white" routerLink="/messages">
            <i class="bi bi-chat-dots-fill fs-5"></i>
          </a>
        </li>
        <!-- User Dropdown -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="rounded-circle bg-light text-primary d-flex justify-content-center align-items-center me-2" style="width: 32px; height: 32px;">
              <i class="bi bi-person-fill"></i>
            </div>
            <span class="d-none d-md-inline">{{ username || 'User' }}</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" routerLink="/profile"><i class="bi bi-person me-2"></i> Profile</a></li>
            <li><a class="dropdown-item" routerLink="/settings"><i class="bi bi-gear me-2"></i> Settings</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i> Logout</button></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
