<div class="container-fluid h-100 py-3" style="max-height: calc(100vh - 80px);">
  <div class="card shadow-sm border-0 h-100">
    <div class="row g-0 h-100">
      
      <!-- Left Column: Contacts List -->
      <div class="col-md-4 col-lg-3 border-end h-100 d-flex flex-column">
        <div class="p-3 border-bottom bg-light">
          <h5 class="mb-0 fw-bold">Messages</h5>
        </div>

        <div class="flex-grow-1 overflow-auto bg-white">
          <div *ngIf="loadingFriends" class="text-center my-4">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          </div>
          
          <div *ngIf="!loadingFriends && friends.length === 0" class="p-4 text-center text-muted">
            <small>You have no friends yet to message.</small>
          </div>

          <div class="list-group list-group-flush" *ngIf="!loadingFriends">
            <button 
              *ngFor="let friendId of friends"
              type="button" 
              class="list-group-item list-group-item-action d-flex align-items-center py-3 border-bottom"
              [class.active]="activeFriendId === friendId"
              [class.bg-primary]="activeFriendId === friendId"
              [class.text-white]="activeFriendId === friendId"
              (click)="selectFriend(friendId)">
              
              <div class="rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm"
                   [ngClass]="activeFriendId === friendId ? 'bg-white text-primary' : 'bg-secondary text-white'"
                   style="width: 45px; height: 45px; font-size: 1.2rem;">
                <i class="bi bi-person-fill"></i>
              </div>
              <div class="flex-grow-1 overflow-hidden">
                <h6 class="mb-0 text-truncate fw-bold">User {{ friendId }}</h6>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column: Chat Window -->
      <div class="col-md-8 col-lg-9 h-100 d-flex flex-column bg-light">
        
        <!-- Empty State -->
        <div *ngIf="!activeFriendId" class="flex-grow-1 d-flex flex-column justify-content-center align-items-center text-muted">
          <div class="rounded-circle bg-white shadow-sm d-flex justify-content-center align-items-center mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
            <i class="bi bi-chat-dots text-primary"></i>
          </div>
          <h5>Your Messages</h5>
          <p>Select a friend from the list to start chatting.</p>
        </div>

        <!-- Active Chat -->
        <ng-container *ngIf="activeFriendId">
          <!-- Chat Header -->
          <div class="p-3 border-bottom bg-white shadow-sm d-flex align-items-center z-1">
            <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center text-white me-3" style="width: 40px; height: 40px;">
              <i class="bi bi-person-fill"></i>
            </div>
            <h6 class="mb-0 fw-bold">User {{ activeFriendId }}</h6>
          </div>

          <!-- Chat Messages Area -->
          <div class="flex-grow-1 overflow-auto p-4 d-flex flex-column" #chatScrollContainer style="height: 0;">
            
            <div *ngIf="loadingChat" class="text-center my-3">
              <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            </div>

            <div *ngIf="!loadingChat && conversation.length === 0" class="text-center text-muted my-auto">
              <small>No messages yet. Say hi!</small>
            </div>

            <!-- Message Bubbles -->
            <div *ngFor="let msg of conversation" class="mb-3 d-flex flex-column" [ngClass]="msg.senderId === currentUserId ? 'align-items-end' : 'align-items-start'">
              <div 
                class="p-3 rounded-3 shadow-sm" 
                style="max-width: 75%;"
                [ngClass]="msg.senderId === currentUserId ? 'bg-primary text-white rounded-bottom-end-0' : 'bg-white border rounded-bottom-start-0'">
                {{ msg.messageText }}
              </div>
              <small class="text-muted mt-1" style="font-size: 0.7rem;">{{ msg.timestamp | date:'shortTime' }}</small>
            </div>
          </div>

          <!-- Chat Input Area -->
          <div class="p-3 bg-white border-top">
            <form (ngSubmit)="sendMessage()" class="d-flex align-items-center gap-2">
              <input 
                type="text" 
                class="form-control rounded-pill bg-light border-0 py-2 px-4" 
                placeholder="Type a message..." 
                name="newMessageText"
                [(ngModel)]="newMessageText"
                autocomplete="off"
                required>
              <button 
                type="submit" 
                class="btn btn-primary rounded-circle d-flex justify-content-center align-items-center shadow-sm"
                style="width: 45px; height: 45px;"
                [disabled]="!newMessageText.trim() || isSending">
                <i class="bi bi-send-fill" *ngIf="!isSending"></i>
                <span class="spinner-border spinner-border-sm" *ngIf="isSending"></span>
              </button>
            </form>
          </div>
        </ng-container>

      </div>
    </div>
  </div>
</div>
