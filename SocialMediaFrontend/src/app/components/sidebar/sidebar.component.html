<div class="card shadow-sm border-0 sticky-top" style="top: 80px; z-index: 1000;">
  <div class="card-body p-0">
    <div class="list-group list-group-flush rounded border-0">
      <a routerLink="/feed" routerLinkActive="active" class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0">
        <i class="bi bi-house-door-fill fs-5 text-primary me-3 w-20px text-center"></i>
        <span class="fw-semibold">News Feed</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0">
        <i class="bi bi-person-fill fs-5 text-success me-3 w-20px text-center"></i>
        <span class="fw-semibold">My Profile</span>
      </a>
      <a routerLink="/friends" routerLinkActive="active" class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0">
        <i class="bi bi-people-fill fs-5 text-info me-3 w-20px text-center"></i>
        <span class="fw-semibold">Friends</span>
      </a>
      <a routerLink="/groups" routerLinkActive="active" class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0">
        <i class="bi bi-diagram-3-fill fs-5 text-warning me-3 w-20px text-center"></i>
        <span class="fw-semibold">Groups</span>
      </a>
      <a routerLink="/messages" routerLinkActive="active" class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0">
        <i class="bi bi-chat-left-text-fill fs-5 text-danger me-3 w-20px text-center"></i>
        <span class="fw-semibold">Messages</span>
      </a>
      <a routerLink="/notifications" routerLinkActive="active" class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0">
        <i class="bi bi-bell-fill fs-5 text-secondary me-3 w-20px text-center"></i>
        <span class="fw-semibold">Notifications</span>
      </a>
    </div>
  </div>
</div>
