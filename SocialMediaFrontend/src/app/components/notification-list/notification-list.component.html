<div class="container mt-4" style="max-width: 800px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">Notifications</h4>
    <span class="badge bg-primary rounded-pill">{{ notifications.length }}</span>
  </div>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading && notifications.length === 0" class="alert alert-light text-center border-0 shadow-sm py-5">
    <i class="bi bi-bell-slash text-muted fs-1 d-block mb-3"></i>
    <h5 class="text-muted">You have no notifications</h5>
  </div>

  <div class="list-group shadow-sm border-0" *ngIf="!loading && notifications.length > 0">
    <div 
      class="list-group-item list-group-item-action d-flex align-items-start py-3 border-0 border-bottom"
      *ngFor="let notification of notifications"
      (click)="markAsRead(notification)"
      style="cursor: pointer;">
      
      <!-- Default Icon -->
      <div class="rounded-circle d-flex justify-content-center align-items-center text-white me-3 mt-1 bg-primary" 
           style="width: 45px; height: 45px; min-width: 45px;">
        <i class="bi bi-bell-fill"></i>
      </div>

      <!-- Content -->
      <div class="flex-grow-1">
        <p class="mb-1">{{ notification.content }}</p>
        <small class="text-muted">{{ notification.timestamp | date:'medium' }}</small>
      </div>

      <!-- Actions -->
      <div class="ms-2">
        <button class="btn btn-sm text-danger border-0 bg-transparent p-1" (click)="deleteNotification(notification.notificationId); $event.stopPropagation()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>
