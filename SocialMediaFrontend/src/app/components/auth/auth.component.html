<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-3">Login</h3>

  <input
    type="email"
    class="form-control mb-2"
    placeholder="Email"
    [(ngModel)]="email"
  />

  <input
    type="password"
    class="form-control mb-3"
    placeholder="Password"
    [(ngModel)]="password"
  />

  <button class="btn btn-primary w-100" (click)="login()">
    Login
  </button>
</div>
